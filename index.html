<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEIL · Private AI inference</title>
<meta name="description" content="VEIL by TII: run AI on data it never sees.">
<meta name="theme-color" content="#07051a">
<meta property="og:title" content="VEIL · Run AI on data it never sees">
<meta property="og:description" content="Encrypted AI inference with FHE and MPC. Technology Innovation Institute.">
<meta property="og:image" content="poster.jpg">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
  :root{--bg:#07051a;--ink:#f4f1ff;--mut:#a7a1c9;--v:#7b3bff;--t:#3fe0cf}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;min-height:100svh;
    background:radial-gradient(900px 600px at 50% 40%,rgba(110,43,255,.28),transparent 70%),var(--bg)}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top)) 20px 12px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .logo img{width:34px;height:29px}
  .logo span{font-weight:800;font-size:24px;letter-spacing:.02em}
  .tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b18cff;
    border:1px solid rgba(177,140,255,.4);border-radius:999px;padding:6px 12px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px}
  .player{position:relative;width:min(100%,1280px);aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    background:#000;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(177,140,255,.25)}
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .sound{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;
    padding:10px 16px;border:0;border-radius:999px;cursor:pointer;
    background:rgba(20,12,60,.78);color:#fff;font:700 14px Inter,system-ui,sans-serif;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .sound svg{width:18px;height:18px}
  .sound[hidden]{display:none}
  footer{padding:14px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:13px}
  footer b{color:var(--ink);font-weight:700}
  .mail{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;color:#7ff0e8;text-decoration:none;font-weight:700;font-size:15px;border:1px solid rgba(127,240,232,.45);background:rgba(63,224,207,.08)}
  @media (orientation:landscape) and (max-height:500px){
    header,footer{display:none} main{padding:0} .player{border-radius:0;width:100%;height:100svh;aspect-ratio:auto}
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="./" aria-label="VEIL"><img src="mark.svg" alt=""><span>VEIL</span></a>
  <span class="tag">Private AI</span>
</header>

<main>
  <div class="player">
    <video id="v" src="veil.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto" controls></video>
    <button class="sound" id="snd" type="button" aria-label="Turn sound on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      Tap for sound
    </button>
  </div>
</main>

<footer><b>VEIL</b> · Run AI on data it never sees · Technology Innovation Institute<br><a class="mail" href="mailto:veil@tii.ae">veil@tii.ae</a></footer>

<script>
  const v = document.getElementById('v'), snd = document.getElementById('snd');
  // Phones only allow autoplay when muted; start muted, offer one tap to unmute.
  const tryPlay = () => v.play().catch(() => {});
  tryPlay();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
  snd.addEventListener('click', () => { v.muted = false; v.currentTime = 0; tryPlay(); snd.hidden = true; });
  v.addEventListener('volumechange', () => { if (!v.muted) snd.hidden = true; });
</script>
</body>
</html>
